services:
  gateway-forwarder:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "80:8080"
    command:
      - TCP-LISTEN:8080,fork,reuseaddr
      - TCP:host.docker.internal:18080
    # socat uses one listener per process, so run the TLS forwarder separately.
  gateway-forwarder-tls:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "443:8443"
    command:
      - TCP-LISTEN:8443,fork,reuseaddr
      - TCP:host.docker.internal:18443
