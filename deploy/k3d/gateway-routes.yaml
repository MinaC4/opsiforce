apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: opsiforce-lan-gateway
  namespace: openchoreo-control-plane
spec:
  secretName: opsiforce-lan-gateway-tls
  issuerRef:
    name: bolt-lan-ca
    kind: Issuer
    group: cert-manager.io
  dnsNames:
    - opsiforce.192.168.1.3.nip.io
    - "*.apps.192.168.1.3.nip.io"
    - "*.code.192.168.1.3.nip.io"
    - "*.db.192.168.1.3.nip.io"
    - bifrost.192.168.1.3.nip.io
    - sso.192.168.1.3.nip.io
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opsiforce-lan-https
  namespace: traefik
spec:
  parentRefs:
    - name: gateway-default
      namespace: openchoreo-control-plane
      sectionName: https
  hostnames:
    - opsiforce.192.168.1.3.nip.io
    - "*.apps.192.168.1.3.nip.io"
    - "*.code.192.168.1.3.nip.io"
    - "*.db.192.168.1.3.nip.io"
    - bifrost.192.168.1.3.nip.io
  rules:
    - backendRefs:
        - name: traefik
          port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opsiforce-lan-http
  namespace: traefik
spec:
  parentRefs:
    - name: gateway-default
      namespace: openchoreo-control-plane
      sectionName: http
  hostnames:
    - opsiforce.192.168.1.3.nip.io
    - "*.apps.192.168.1.3.nip.io"
    - "*.code.192.168.1.3.nip.io"
    - "*.db.192.168.1.3.nip.io"
    - bifrost.192.168.1.3.nip.io
    - sso.192.168.1.3.nip.io
  rules:
    - backendRefs:
        - name: traefik
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opsiforce-sso-https
  namespace: opsiforce
spec:
  parentRefs:
    - name: gateway-default
      namespace: openchoreo-control-plane
      sectionName: https
  hostnames:
    - sso.192.168.1.3.nip.io
  rules:
    - backendRefs:
        - name: opsiforce-keycloak
          port: 8080
