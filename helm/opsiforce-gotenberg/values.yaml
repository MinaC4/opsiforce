replicaCount: 1

fullnameOverride: opsiforce-gotenberg

image:
  repository: gotenberg/gotenberg
  tag: "8.36.0-libreoffice"
  pullPolicy: IfNotPresent

# 3000 (Gotenberg's default) is already the App port on this platform; the converter
# listens on the next free slot after the runtime proxies (3002-3005). The template
# feeds this to API_PORT so the container, Service, and probes all follow one value.
service:
  port: 3006

# Gotenberg reads every CLI flag from the matching env var (dashes to underscores,
# upper-cased). Defaults kept deliberately: API_TIMEOUT=30s, LIBREOFFICE_RESTART_AFTER=10.
env:
  LIBREOFFICE_AUTO_START: "true"
  LIBREOFFICE_MAX_QUEUE_SIZE: "10"
  LIBREOFFICE_DENY_PRIVATE_IPS: "true"
  API_BODY_LIMIT: "32MB"
  API_DISABLE_DOWNLOAD_FROM: "true"

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

imagePullSecrets: []
nameOverride: ""

nodeSelector: {}
tolerations: []

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: cfke.io/region
              operator: In
              values:
                - northamerica
            - key: cfke.io/subregion
              operator: In
              values:
                - east
            - key: node.kubernetes.io/instance-type
              operator: NotIn
              values:
                - cpx11
                - cpx21
                - cpx22
                - cpx32
                - ccx13
                - cx23
                - cx33
