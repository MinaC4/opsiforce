nameOverride: ""
fullnameOverride: ""

imagePullSecrets:
  - name: ghcr-pull-secret

storage:
  type: pvc
  pvcName: opsiforce-cephfs
  className: ceph-filesystem-immediate
  size: 300Gi
  hostPath: /tmp/opsiforce-data

agent:
  image:
    repository: ""
    tag: agent
    pullPolicy: Always
  port: 4096
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  nodeSelector: {}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: cfke.io/region
                operator: In
                values:
                  - northamerica
              - key: cfke.io/subregion
                operator: In
                values:
                  - east
              - key: node.kubernetes.io/instance-type
                operator: NotIn
                values:
                  - cpx11
                  - cpx21
                  - cpx22
                  - cpx32
                  - ccx13
                  - cx23
                  - cx33
    tolerations: []

warmPool:
  size: 1

timeout:
  idleMinutes: 30

valkey:
  enabled: true
  replica:
    enabled: false
  auth:
    enabled: false
  valkeyConfig: |
    notify-keyspace-events Ex
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: cfke.io/region
                operator: In
                values:
                  - northamerica
              - key: cfke.io/subregion
                operator: In
                values:
                  - east
              - key: node.kubernetes.io/instance-type
                operator: NotIn
                values:
                  - cpx11
                  - cpx21
                  - cpx22
                  - cpx32
                  - ccx13
                  - cx23
                  - cx33
