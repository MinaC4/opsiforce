fullnameOverride: opsiforce-backend

backend:
  image:
    repository: opsiforce-backend
    tag: k3d
    pullPolicy: Never
  resources:
    requests:
      cpu: 100m
      memory: 300Mi

imagePullSecrets: []
affinity: null
serviceAccountName: opsiforce-agent

config:
  databaseUrlSecretName: opsiforce-database-url
  runtimeSecretsName: opsiforce-runtime-secrets
  k8sNamespace: opsiforce
  redisUrl: redis://opsiforce-infra-valkey:6379/0
  cephfsPvcName: opsiforce-cephfs
  storageType: cephfs
  storageMountPath: /workspace-data
  storageClaimSize: 50Gi
  agentContainerImage: opsiforce-agent:0.35.4
  agentContainerImagePullPolicy: Never
  agentAffinity: null
  agentNodeSelector: {}
  agentTolerations: []
  bifrostUseOpenrouter: "true"
  bifrostProxyUrl: http://opsiforce-bifrost:8080/v1
  bifrostPodProxyUrl: http://opsiforce-bifrost:8080/v1
  bifrostAdminUsername: ""
  bifrostAdminPassword: ""
  gotenbergUrl: http://opsiforce-gotenberg:3006
  gatewayUrl: http://opsiforce-backend:3001/api/gateway
  platformApiUrl: http://opsiforce-backend:3001/api/v1
  runtimeProxyUrl: http://proxy-agent:3005
  externalServicesUrl: http://opsiforce-backend:3001/api/external-services/agent
  externalServicesEncryptionKey: ""
  appsHostname: apps.192.168.1.3.nip.io
  webappServiceName: proxy-app
  webappServicePort: "3002"
  oidcPluginSecret: ""
  managedOidcClientId: opsiforce-apps
  managedOidcClientSecret: ""
  managedOidcIssuerUrl: https://sso.192.168.1.3.nip.io:18443/realms/opsiforce
  externalHttpsPort: "18443"
  managedTenantRolePrefix: opsiforce_tenant_name_
