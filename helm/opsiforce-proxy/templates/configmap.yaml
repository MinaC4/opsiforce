apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opsiforce-proxy.fullname" . }}
data:
  nginx.conf.template: |
    user nginx;
    worker_processes  1;
    events {
      worker_connections  10240;
    }
    http {
      resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;

      client_max_body_size 0;
      client_body_timeout 3600s;
      send_timeout 3600s;

      client_header_buffer_size 128k;
      large_client_header_buffers 4 128k;

      {{- if .Values.appProxy.previewAppsHostname }}
      server {
          listen       80;
          server_name  ~^[a-f0-9-]+\.{{ .Values.appProxy.previewAppsHostname | replace "." "\\." }}$;
          location / {
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_pass http://{{ .Values.appProxy.backendService }}:{{ .Values.appProxy.backendPort }};
          }
      }
      {{- end }}

      server {
          listen       80;
          server_name  ~^[a-f0-9-]+\.{{ .Values.vscodeProxy.appsHostname | replace "." "\\." }}$;
          location / {
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_pass http://{{ .Values.vscodeProxy.backendService }}:3003;
          }
      }

      server {
          listen       80;
          server_name  ~^[a-f0-9-]+\.{{ .Values.dbProxy.appsHostname | replace "." "\\." }}$;
          location / {
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_pass http://{{ .Values.dbProxy.backendService }}:3004;
          }
      }

      server {
          listen       80 default_server;
          server_name  _;
          location = /healthz {
            access_log off;
            return 200 'ok';
          }
          # opencode's client probes <serverUrl>/global/health to pick its protocol, but
          # builds that as an absolute path — which discards our /api/proxy/<envId> prefix
          # and lands here. Answering it keeps protocol detection on v1; without this it
          # falls through to its v2 default and the session list and event stream fail.
          location = /global/health {
            access_log off;
            default_type application/json;
            return 200 '{"healthy":true}';
          }
          location /api/gateway {
            return 403;
          }
          location /api/external-services/agent {
            return 403;
          }
          {{- if .Values.keycloakMs.enabled }}
          location /ms-api {
            set $keycloak_ms_api_backend {{ .Values.proxy.keycloakMsApiBackend }};
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            proxy_set_header Host $proxy_host;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "Bearer $http_x_forwarded_access_token";
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_ssl_server_name on;
            proxy_pass $keycloak_ms_api_backend;
          }
          location /ms-assets {
            set $keycloak_ms_assets_backend {{ .Values.proxy.keycloakMsAssetsBackend }};
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Host $proxy_host;
            proxy_set_header Cookie "";
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_ssl_server_name on;
            proxy_pass $keycloak_ms_assets_backend;
          }
          {{- end }}
          location /api/proxy {
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            {{- if eq .Values.auth.mode "static" }}
            {{- include "opsiforce-proxy.staticHeaders" . | nindent 12 }}
            {{- end }}
            proxy_read_timeout 86400s;
            proxy_pass {{ .Values.proxy.agentService }};
          }
          location /api {
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            {{- if eq .Values.auth.mode "static" }}
            {{- include "opsiforce-proxy.staticHeaders" . | nindent 12 }}
            {{- end }}
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_pass {{ .Values.proxy.backendService }};
          }
          location / {
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_pass {{ .Values.proxy.frontendService }};
          }
      }
    }
