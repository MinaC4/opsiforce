apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opsiforce-proxy.fullname" . }}
data:
  nginx.conf.template: |
    user nginx;
    worker_processes  1;
    events {
      worker_connections  10240;
    }
    http {
      resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;

      client_max_body_size 0;
      client_body_timeout 3600s;
      send_timeout 3600s;

      client_header_buffer_size 128k;
      large_client_header_buffers 4 128k;

      {{- if .Values.appProxy.previewAppsHostname }}
      server {
          listen       80;
          server_name  ~^[a-f0-9-]+\.{{ .Values.appProxy.previewAppsHostname | replace "." "\\." }}$;
          location / {
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_pass http://{{ .Values.appProxy.backendService }}:{{ .Values.appProxy.backendPort }};
          }
      }
      {{- end }}

      server {
          listen       80;
          server_name  ~^[a-f0-9-]+\.{{ .Values.vscodeProxy.appsHostname | replace "." "\\." }}$;
          location / {
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_pass http://{{ .Values.vscodeProxy.backendService }}:3003;
          }
      }

      server {
          listen       80;
          server_name  ~^[a-f0-9-]+\.{{ .Values.dbProxy.appsHostname | replace "." "\\." }}$;
          location / {
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_pass http://{{ .Values.dbProxy.backendService }}:3004;
          }
      }

      server {
          listen       80 default_server;
          server_name  _;
          location = /healthz {
            access_log off;
            return 200 'ok';
          }
          location /api/gateway {
            return 403;
          }
          location /api/external-services/agent {
            return 403;
          }
          {{- if eq .Values.auth.mode "oidc" }}
          location /oauth2/ {
            proxy_pass http://127.0.0.1:4180;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Auth-Request-Redirect $http_x_forwarded_proto://$host$request_uri;
          }
          location = /oauth2/auth {
            internal;
            proxy_pass http://127.0.0.1:4180/oauth2/auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Content-Length "";
            proxy_pass_request_body off;
          }
          location @oauth2_signin {
            return 302 /oauth2/sign_in?rd=$http_x_forwarded_proto://$host$request_uri;
          }
          {{- end }}
          location ^~ /api/external-services/webhooks/ {
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_pass {{ .Values.proxy.backendService }};
          }
          location = /api/v1/openapi.json {
            proxy_set_header Host $host;
            proxy_pass {{ .Values.proxy.backendService }};
          }
          location = /api/v1/runtime/openapi.json {
            proxy_set_header Host $host;
            proxy_pass {{ .Values.proxy.backendService }};
          }
          location ^~ /api/v1/docs {
            proxy_set_header Host $host;
            proxy_pass {{ .Values.proxy.backendService }};
          }
          {{- if .Values.keycloakMs.enabled }}
          location /ms-api {
            set $keycloak_ms_api_backend {{ .Values.proxy.keycloakMsApiBackend }};
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            proxy_set_header Host $proxy_host;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "Bearer $http_x_forwarded_access_token";
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_ssl_server_name on;
            proxy_pass $keycloak_ms_api_backend;
          }
          location /ms-assets {
            set $keycloak_ms_assets_backend {{ .Values.proxy.keycloakMsAssetsBackend }};
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Host $proxy_host;
            proxy_set_header Cookie "";
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_ssl_server_name on;
            proxy_pass $keycloak_ms_assets_backend;
          }
          {{- end }}
          location /api/proxy {
            {{- if eq .Values.auth.mode "oidc" }}
            {{- include "opsiforce-proxy.oidcAuth" . | nindent 12 }}
            {{- end }}
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            {{- if eq .Values.auth.mode "static" }}
            {{- include "opsiforce-proxy.staticHeaders" . | nindent 12 }}
            {{- end }}
            proxy_read_timeout 86400s;
            proxy_pass {{ .Values.proxy.agentService }};
          }
          location /api {
            {{- if eq .Values.auth.mode "oidc" }}
            {{- include "opsiforce-proxy.oidcAuth" . | nindent 12 }}
            {{- end }}
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            {{- if eq .Values.auth.mode "static" }}
            {{- include "opsiforce-proxy.staticHeaders" . | nindent 12 }}
            {{- end }}
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_pass {{ .Values.proxy.backendService }};
          }
          location / {
            {{- if eq .Values.auth.mode "oidc" }}
            {{- include "opsiforce-proxy.oidcAuth" . | nindent 12 }}
            {{- end }}
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_pass {{ .Values.proxy.frontendService }};
          }
      }
    }
