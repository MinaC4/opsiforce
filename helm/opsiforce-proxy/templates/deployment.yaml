apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opsiforce-proxy.fullname" . }}
  labels:
    app: {{ include "opsiforce-proxy.fullname" . }}
spec:
    replicas: {{ .Values.replicaCount }}
    selector:
        matchLabels:
          app: {{ include "opsiforce-proxy.fullname" . }}
    template:
        metadata:
          annotations:
              rollme: {{ randAlphaNum 5 | quote }}
              karpenter.sh/do-not-disrupt: "true"
          labels:
              app: {{ include "opsiforce-proxy.fullname" . }}
        spec:
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumes:
            - name: nginx-conf
              configMap:
                name: {{ include "opsiforce-proxy.fullname" . }}
                items:
                  - key: nginx.conf.template
                    path: nginx.conf.template
            {{- if .Values.oauth2Proxy.credentialsSecret }}
            - name: auth-credentials
              secret:
                secretName: {{ .Values.oauth2Proxy.credentialsSecret }}
            {{- end }}
            {{- if .Values.oauth2Proxy.trustedCaConfigMap }}
            - name: trusted-ca
              configMap:
                name: {{ .Values.oauth2Proxy.trustedCaConfigMap }}
            {{- end }}
          containers:
          - name: {{ .Chart.Name }}
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
            imagePullPolicy: {{ .Values.image.pullPolicy }}
            env:
              - name: NGINX_ENTRYPOINT_LOCAL_RESOLVERS
                value: "true"
              - name: NGINX_ENVSUBST_OUTPUT_DIR
                value: /etc/nginx
            lifecycle:
              preStop:
                exec:
                  command: [ sh, -c, "sleep 30" ]
            ports:
              - name: http
                containerPort: {{ .Values.service.port }}
                protocol: TCP
            livenessProbe:
                {{- toYaml .Values.livenessProbe | nindent 16 }}
            readinessProbe:
                {{- toYaml .Values.readinessProbe | nindent 16 }}
            resources:
                {{- toYaml .Values.resources | nindent 16 }}
            volumeMounts:
              - name: nginx-conf
                mountPath: /etc/nginx/templates/nginx.conf.template
                subPath: nginx.conf.template
                readOnly: true
          {{- if eq .Values.auth.mode "oidc" }}
          - name: opsiforce-oauth2-proxy
            image: {{ .Values.oauth2Proxy.image }}
            readinessProbe:
                httpGet:
                  path: /ping
                  port: 4180
            livenessProbe:
                httpGet:
                  path: /ping
                  port: 4180
            lifecycle:
              preStop:
                exec:
                  command: [ sh, -c, "sleep 30" ]
            resources:
              {{- toYaml .Values.resources | nindent 18 }}
            {{- if .Values.oauth2Proxy.credentialsSecret }}
            env:
              - name: OAUTH2_PROXY_COOKIE_SECRET
                valueFrom:
                  secretKeyRef:
                    name: {{ .Values.oauth2Proxy.credentialsSecret }}
                    key: cookie-secret
              - name: OAUTH2_PROXY_CLIENT_SECRET
                valueFrom:
                  secretKeyRef:
                    name: {{ .Values.oauth2Proxy.credentialsSecret }}
                    key: client-secret
              {{- if .Values.oauth2Proxy.trustedCaConfigMap }}
              - name: SSL_CERT_FILE
                value: /etc/opsiforce-ca/ca.crt
              {{- end }}
            {{- else if .Values.oauth2Proxy.trustedCaConfigMap }}
            env:
              - name: SSL_CERT_FILE
                value: /etc/opsiforce-ca/ca.crt
            {{- end }}
            args:
                - --provider={{ .Values.oauth2Proxy.provider | default "keycloak-oidc" }}
                - --http-address=0.0.0.0:4180
                - --upstream="http://localhost:{{ .Values.service.port }}/"
                - --client-id={{ .Values.oauth2Proxy.clientId }}
                {{- if .Values.oauth2Proxy.credentialsSecret }}
                - --cookie-secret=$(OAUTH2_PROXY_COOKIE_SECRET)
                {{- else }}
                - --cookie-secret={{ .Values.oauth2Proxy.cookieSecret }}
                {{- end }}
                - --cookie-domain={{ .Values.oauth2Proxy.cookieDomain }}
                - --cookie-name={{ .Values.oauth2Proxy.cookieName }}
                - --session-store-type=redis
                - --redis-connection-url={{ .Values.oauth2Proxy.redisPath }}
                - --skip-provider-button=true
                - --email-domain=*
                - --oidc-email-claim={{ .Values.oauth2Proxy.emailClaim | default "preferred_username" }}
                - --pass-access-token=true
                {{- if .Values.oauth2Proxy.credentialsSecret }}
                - --client-secret=$(OAUTH2_PROXY_CLIENT_SECRET)
                {{- else }}
                - --client-secret={{ .Values.oauth2Proxy.clientSecret }}
                {{- end }}
                - --oidc-issuer-url={{ .Values.oauth2Proxy.issuerUrl }}
                {{- if .Values.oauth2Proxy.logoutUrl }}
                - --backend-logout-url={{ .Values.oauth2Proxy.logoutUrl }}
                {{- end }}
                - --cookie-secure={{ .Values.oauth2Proxy.cookieSecure | default true }}
                - --skip-jwt-bearer-tokens=true
                - --cookie-csrf-per-request=true
                - --redirect-url={{ .Values.oauth2Proxy.redirectUrl }}
                - --skip-auth-route=GET=^/assets/.*$
                - --skip-auth-route=GET=^/favicon/.*$
                {{- if .Values.keycloakMs.enabled }}
                - --skip-auth-route=GET=^/ms-assets/.*$
                {{- end }}
                - --skip-auth-route=GET=^/manifest.webmanifest$
                - --skip-auth-route=GET=^/api/v1/openapi.json$
                - --skip-auth-route=GET=^/api/v1/runtime/openapi.json$
                - --skip-auth-route=GET=^/api/v1/docs(/.*)?$
                - --api-route=^/api/(v1|proxy)/
                - --skip-auth-route=POST=^/api/external-services/webhooks/.*$
                - --cookie-refresh=4m
                {{- range .Values.oauth2Proxy.extraArgs }}
                - {{ . | quote }}
                {{- end }}
            {{- if .Values.oauth2Proxy.credentialsSecret }}
            volumeMounts:
              - name: auth-credentials
                mountPath: /secrets
                readOnly: true
              {{- if .Values.oauth2Proxy.trustedCaConfigMap }}
              - name: trusted-ca
                mountPath: /etc/opsiforce-ca
                readOnly: true
              {{- end }}
            {{- else if .Values.oauth2Proxy.trustedCaConfigMap }}
            volumeMounts:
              - name: trusted-ca
                mountPath: /etc/opsiforce-ca
                readOnly: true
            {{- end }}
          {{- end }}
